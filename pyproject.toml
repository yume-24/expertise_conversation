[project]
name = "horizons-2"
version = "0.1.0"
description = "Reproducible conversational geometry analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.3.4",
  "pandas==2.3.3",
  "scipy==1.16.3",
  "statsmodels==0.14.5",
  "matplotlib==3.10.7",
  "seaborn==0.13.2",
  "sentence-transformers==5.1.2",
  "torch==2.9.1",
]

[dependency-groups]
dev = ["nbformat==5.10.4", "nbclient==0.10.2", "ipykernel==7.1.0"]

[tool.uv]
package = false

